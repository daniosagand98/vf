:root{--b:#0b66c3;--bg:#f2f5f9;--card:#fff;--txt:#13233a;--mut:#65758b;--line:#dbe3ed;--red:#bc3434}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{border:0;border-radius:12px;font-weight:700}.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#094c91,var(--b));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.top h1{font-size:21px;margin:0}.top small{opacity:.85}.langs{display:flex;gap:4px}.langs button{font-size:21px;padding:6px;background:#ffffff1f}.langs button.on{background:#fff}.period{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;margin-top:12px}.period button,.period select{height:42px;border:0;border-radius:11px}.period select{width:100%;padding:0 8px}.wrap{padding:12px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric,.entry,.menuBox{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 4px 16px #17355b0c}.metric{padding:12px}.metric span{display:block;font-size:12px;color:var(--mut)}.metric b{display:block;font-size:22px;margin-top:4px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.sectionTitle h2{font-size:17px;margin:0}.entry{padding:14px;margin-bottom:9px}.entryHead{display:flex;justify-content:space-between;gap:10px}.entryDate{font-weight:800;font-size:17px}.entryTime{font-size:18px;font-weight:800;margin:7px 0}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:12px;padding:5px 8px;border-radius:999px;background:#eaf3ff;color:#0956a4}.chip.p50{background:#fff1d9;color:#8a5700}.chip.p100{background:#ffe6e6;color:#a22222}.chip.tb{background:#e9f8ef;color:#17613a}.actions{display:flex;gap:7px;margin-top:12px}.actions button{padding:7px 10p </style></head><body><header class="top"><div class="toprow"><div><h1 id="appTitle">Moje godziny</h1><small id="appSub">Okres rozliczeniowy 26–25</small></div><div class="langs"><button data-lang="pl">🇵🇱</button><button data-lang="en">🇬🇧</button><button data-lang="no">🇳🇴</button></div></div><div class="period"><button id="prev">‹</button><select id="period"></select><button id="next">›</button></div></header><main class="wrap"><section class="summary"><div class="metric"><span id="lReg">Zwykłe</span><b id="reg">0:00</b></div><div class="metric"><span>50%</span><b id="p50">0:00</b></div><div class="metric"><span>100%</span><b id="p100">0:00</b></div><div class="metric"><span id="lTb">Time bank</span><b id="tb">0:00</b></div><div class="metric"><span id="lVw">Vakt pn–pt</span><b id="vw">0</b></div><div class="metric"><span id="lVe">Vakt weekend</span><b id="ve">0</b></div></section><div class="sectionTitle"><h2 id="historyTitle">Historia wpisów</h2></div><section id="entries"></section></main><nav class="bottom"><button id="quickExcel">📊 Excel</button><button class="add" id="add">＋ <span id="addText">Dodaj wpis</span></button><button id="dataBtn">💾 <span id="dataText">Dane</span></button></nav><input type="file" id="importFile" class="hidden" accept="application/json,.json"><div class="modal" id="entryModal"><div class="sheet"><div class="handle"></div><h2 id="modalTitle">Dodaj wpis</h2><form id="form"><input type="hidden" id="editId"><div class="field"><label id="dateLabel">Data</label><input id="date" type="date" required><div class="quick"><button type="button" id="today">Dzisiaj</button><button type="button" id="yesterday">Wczoraj</button></div></div><div class="timeRow"><div class="field timeField"><label id="fromLabel">Od</label><input id="start" type="time" required></div><div class="field timeField"><label id="toLabel">Do</label><input id="end" type="time" required></div></div><div class="quick"><button type="button" data-start="05:30">05:30</button><button type="button" data-start="07:00">07:00</button><button type="button" data-start="09:00">09:00</button></div><div class="field"><label id="typeLabel">Sposób rozliczenia</label><select id="type"><option value="regular">Zwykłe godziny</option><option value="timebank">Time bank</option><option value="vakt">Vakt</option><option value="bonus">BONUS</option></select></div><div class="field"><label id="noteLabel">Notatka</label><input id="note" maxlength="100"></div><div class="sheetButtons"><button type="button" id="cancel">Anuluj</button><button class="save" id="save" type="submit">Zapisz</button></div></form></div></div><div class="modal" id="dataModal"><div class="menuBox"><div class="handle"></div><h2 id="dataTitle">Dane</h2><div id="mainDataMenu"><button id="exportJson">📤 Eksport danych JSON</button><button id="importJson">📥 Import danych JSON</button></div><div id="importChoice" class="importChoice"><div id="importStatus" class="status"></div><button id="mergeData">🔗 Połącz dane</button><button id="replaceData">♻️ Zastąp obecne dane</button><button id="cancelImport">← Wróć</button></div><button id="closeData" class="close">Zamknij</button></div></div><script>
const KEY='work_hours_mobile_v3';let data=[],lang=localStorage.getItem('hours_lang')||'pl',pendingImport=null;for(const k of [KEY,'work_hours_mobile_v2','mobile_hours_v1']){try{let v=JSON.parse(localStorage.getItem(k)||'null');if(Array.isArray(v)){data=v;break}}catch(e){}}const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0'),mins=t=>{let[a,b]=t.split(':').map(Number);return a*60+b},round15=n=>Math.round(n/15)*15,fmt=n=>`${Math.floor(n/60)}:${pad(Math.round(n)%60)}`,dte=x=>new Date(x+'T12:00:00');
const T={pl:{title:'Moje godziny',sub:'Okres rozliczeniowy 26–25',reg:'Zwykłe',tb:'Time bank',vw:'Vakt pn–pt',ve:'Vakt weekend',history:'Historia wpisów',add:'Dodaj wpis',data:'Dane',date:'Data',today:'Dzisiaj',yesterday:'Wczoraj',from:'Od',to:'Do',type:'Sposób rozliczenia',note:'Notatka',cancel:'Anuluj',save:'Zapisz',regular:'Zwykłe godziny',vakt:'Vakt',empty:'Brak wpisów w tym okresie',edit:'Edytuj',del:'Usuń',paid:'Płatne'},en:{title:'My Work Hours',sub:'Payroll period 26–25',reg:'Regular',tb:'Time bank',vw:'Weekday on-call',ve:'Weekend on-call',history:'Entry history',add:'Add entry',data:'Data',date:'Date',today:'Today',yesterday:'Yesterday',from:'From',to:'To',type:'Entry type',note:'Note',cancel:'Cancel',save:'Save',regular:'Regular hours',vakt:'On-call duty',empty:'No entries in this period',edit:'Edit',del:'Delete',paid:'Paid'},no:{title:'Mine arbeidstimer',sub:'Lønnsperiode 26–25',reg:'Vanlige',tb:'Timebank',vw:'Vakt ukedag',ve:'Vakt helg',history:'Historikk',add:'Legg til',data:'Data',date:'Dato',today:'I dag',yesterday:'I går',from:'Fra',to:'Til',type:'Registreringstype',note:'Notat',cancel:'Avbryt',save:'Lagre',regular:'Vanlige timer',vakt:'Vakt',empty:'Ingen oppføringer i perioden',edit:'Rediger',del:'Slett',paid:'Betalt'}};
function period(s){let d=dte(s),y=d.getFullYear(),m=d.getMonth();if(d.getDate()<26){m--;if(m<0){m=11;y--}}return{key:`${y}-${pad(m+1)}`,a:new Date(y,m,26),b:new Date(y,m+1,25)}}function calc(e){let s=round15(mins(e.start)),en=round15(mins(e.end));if(en<=s)en+=1440;let elapsed=en-s;if(e.type==='vakt')return{paid:0,r:0,f:0,h:0,t:0,b:0,t50:0,t100:0};if(e.type==='bonus'){let b=Math.max(180,elapsed);return{paid:b,r:0,f:0,h:0,t:0,b,t50:0,t100:0}}let bs=elapsed>=360?s+330:Infinity,be=elapsed>=360?s+360:Infinity,ordinary=0,sat50=0,h=0;for(let m=s;m<en;m++){if(m>=bs&&m<be)continue;let d=dte(e.date);d.setMinutes(d.getMinutes()+m-s);let day=d.getDay(),c=(m%1440+1440)%1440,night=c>=1260||c<360,sat=day===6,sun=day===0;if(e.type==='timebank'){if(sun||night||(sat&&c>=720))h++;else sat50++;continue}if(sun||night||(sat&&c>=720))h++;else if(sat&&c>=360&&c<720)sat50++;else ordinary++}if(e.type==='timebank'){let t=Math.round(sat50*1.5+h*2);return{paid:t,r:0,f:0,h:0,t,b:0,t50:sat50,t100:h}}let r=Math.min(450,ordinary),f=sat50+Math.max(0,ordinary-450);return{paid:r+f+h,r,f,h,t:0,b:0,t50:0,t100:0}}
function makePeriods(){let cur=$('period').value||period(new Date().toISOString().slice(0,10)).key;$('period').innerHTML='';let n=new Date();for(let i=-24;i<=12;i++){let d=new Date(n.getFullYear(),n.getMonth()+i,26),p=period(`${d.getFullYear()}-${pad(d.getMonth()+1)}-26`);$('period').add(new Option(`${pad(p.a.getDate())}.${pad(p.a.getMonth()+1)}.${p.a.getFullYear()} – ${pad(p.b.getDate())}.${pad(p.b.getMonth()+1)}.${p.b.getFullYear()}`,p.key))}$('period').value=cur}
function render(){let x=T[lang],list=data.filter(e=>period(e.date).key===$('period').value).sort((a,b)=>b.date.localeCompare(a.date)),r=0,f=0,h=0,tb=0,vw=0,ve=0;$('entries').innerHTML='';for(let e of list){let c=calc(e),wk=[0,6].includes(dte(e.date).getDay());if(e.type==='vakt')wk?ve++:vw++;else{r+=c.r;f+=c.f;h+=c.h+c.b;tb+=c.t}let chips=e.type==='vakt'?`<span class="chip">${wk?x.ve:x.vw}</span>`:e.type==='bonus'?`<span class="chip p100">BONUS ${fmt(c.b)} → 100%</span>`:e.type==='timebank'?`<span class="chip tb">${x.tb} ${fmt(c.t)}</span><span class="chip p50">${fmt(c.t50)} ×1.5</span><span class="chip p100">${fmt(c.t100)} ×2</span>`:`<span class="chip">${x.reg} ${fmt(c.r)}</span><span class="chip p50">50% ${fmt(c.f)}</span><span class="chip p100">100% ${fmt(c.h)}</span>`;$('entries').insertAdjacentHTML('beforeend',`<article class="entry"><div class="entryHead"><span class="entryDate">${e.date.split('-').reverse().join('.')}</span><span>${e.type==='vakt'?'':x.paid+' '+fmt(c.paid)}</span></div><div class="entryTime">${e.start}–${e.end}</div><div class="chips">${chips}</div>${e.note?`<p>${e.note}</p>`:''}<div class="actions"><button data-edit="${e.id}">✏️ ${x.edit}</button><button class="delete" data-delete="${e.id}">🗑️ ${x.del}</button></div></article>`)}if(!list.length)$('entries').innerHTML=`<div class="empty">${x.empty}</div>`;$('reg').textContent=fmt(r);$('p50').textContent=fmt(f);$('p100').textContent=fmt(h);$('tb').textContent=fmt(tb);$('vw').textContent=vw;$('ve').textContent=ve}
function translate(){let x=T[lang];$('appTitle').textContent=x.title;$('appSub').textContent=x.sub;$('lReg').textContent=x.reg;$('lTb').textContent=x.tb;$('lVw').textContent=x.vw;$('lVe').textContent=x.ve;$('historyTitle').textContent=x.history;$('addText').textContent=x.add;$('dataText').textContent=x.data;$('modalTitle').textContent=x.add;$('dateLabel').textContent=x.date;$('today').textContent=x.today;$('yesterday').textContent=x.yesterday;$('fromLabel').textContent=x.from;$('toLabel').textContent=x.to;$('typeLabel').textContent=x.type;$('noteLabel').textContent=x.note;$('cancel').textContent=x.cancel;$('save').textContent=x.save;$('type').options[0].text=x.regular;$('type').options[1].text=x.tb;$('type').options[2].text=x.vakt;document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));render()}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}function iso(d){return d.toISOString().slice(0,10)}function openForm(e){$('form').reset();$('editId').value=e?.id||'';$('date').value=e?.date||iso(new Date());$('start').value=e?.start||'';$('end').value=e?.end||'';$('type').value=e?.type||'regular';$('note').value=e?.note||'';$('entryModal').classList.add('open')}function closeForm(){$('entryModal').classList.remove('open')}$('add').onclick=()=>openForm();$('cancel').onclick=closeForm;$('entryModal').onclick=e=>{if(e.target===$('entryModal'))closeForm()};$('today').onclick=()=>$('date').value=iso(new Date());$('yesterday').onclick=()=>{let d=new Date();d.setDate(d.getDate()-1);$('date').value=iso(d)};document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>$('start').value=b.dataset.start);$('form').onsubmit=e=>{e.preventDefault();let o={id:$('editId').value||Date.now()+'',date:$('date').value,start:$('start').value,end:$('end').value,type:$('type').value,note:$('note').value.trim()},i=data.findIndex(v=>v.id===o.id);i<0?data.push(o):data[i]=o;$('period').value=period(o.date).key;persist();closeForm()};$('entries').onclick=e=>{let id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;if(e.target.dataset.delete){if(confirm(T[lang].del+'?')){data=data.filter(v=>v.id!==id);persist()}}else openForm(data.find(v=>v.id===id))};$('period').onchange=render;$('prev').onclick=()=>{if($('period').selectedIndex){$('period').selectedIndex--;render()}};$('next').onclick=()=>{if($('period').selectedIndex<$('period').options.length-1){$('period').selectedIndex++;render()}};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('hours_lang',lang);translate()});
function dl(n,s,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportJson(){dl(`Work_Hours_Backup_${iso(new Date())}.json`,JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2),'application/json')}$('dataBtn').onclick=()=>{$('dataModal').classList.add('open');$('mainDataMenu').classList.remove('hidden');$('importChoice').classList.remove('show')};$('closeData').onclick=()=>$('dataModal').classList.remove('open');$('dataModal').onclick=e=>{if(e.target===$('dataModal'))$('dataModal').classList.remove('open')};$('exportJson').onclick=exportJson;$('importJson').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text()),arr=Array.isArray(j)?j:j.data;if(!Array.isArray(arr))throw Error('Invalid');for(let x of arr){if(!x.date||!x.start||!x.end||!['regular','timebank','vakt','bonus'].includes(x.type))throw Error('Invalid entry')}pendingImport=arr;$('mainDataMenu').classList.add('hidden');$('importChoice').classList.add('show');$('importStatus').textContent=`${arr.length} wpisów gotowych do importu.`}catch(_){alert('Nieprawidłowy plik kopii danych.')}e.target.value=''};$('mergeData').onclick=()=>{let m=new Map(data.map(x=>[x.id,x]));for(let x of pendingImport){let key=x.id||`${x.date}_${x.start}_${x.end}_${x.type}`;if(!m.has(key))m.set(key,{...x,id:key})}data=[...m.values()];persist();$('dataModal').classList.remove('open')};$('replaceData').onclick=()=>{if(confirm('Zastąpić wszystkie obecne dane zawartością kopii?')){data=pendingImport.map((x,i)=>({...x,id:x.id||Date.now()+'_'+i}));persist();$('dataModal').classList.remove('open')}};$('cancelImport').onclick=()=>{$('mainDataMenu').classList.remove('hidden');$('importChoice').classList.remove('show')};
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function cell(v,type='String',style=''){return `<Cell${style?` ss:StyleID="${style}"`:''}><Data ss:Type="${type}">${esc(v)}</Data></Cell>`}function exportExcel(){let list=data.filter(e=>period(e.date).key===$('period').value).sort((a,b)=>a.date.localeCompare(b.date));let heads=['Date','Start','End','Paid hours','Regular hours','50% hours','100% hours incl. bonus','Time bank weighted','Time bank x1.5','Time bank x2','On-call duty','Note'];let rows=`<Row>${heads.map(v=>cell(v,'String','H')).join('')}</Row>`;for(let e of list){let c=calc(e),wk=[0,6].includes(dte(e.date).getDay());rows+=`<Row>${cell(e.date+'T00:00:00.000','DateTime','D')}${cell(e.start)}${cell(e.end)}${cell(e.type==='vakt'?'':c.paid/60,'Number','N')}${cell(c.r/60,'Number','N')}${cell(c.f/60,'Number','N')}${cell((c.h+c.b)/60,'Number','N')}${cell(c.t/60,'Number','N')}${cell(c.t50/60,'Number','N')}${cell(c.t100/60,'Number','N')}${cell(e.type==='vakt'?(wk?'Weekend':'Weekday'):'')}${cell(e.note)}</Row>`}let xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="H"><Font ss:Bold="1"/><Interior ss:Color="#D9EAF7" ss:Pattern="Solid"/></Style><Style ss:ID="D"><NumberFormat ss:Format="yyyy-mm-dd"/></Style><Style ss:ID="N"><NumberFormat ss:Format="0.00"/></Style></Styles><Worksheet ss:Name="Work Hours"><Table>${rows}</Table></Worksheet></Workbook>`;dl(`Work_Hours_Report_${$('period').value}.xls`,xml,'application/vnd.ms-excel')}$('quickExcel').onclick=exportExcel;if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');makePeriods();translate();
</script></body></html>
